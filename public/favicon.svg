<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#2fe0c4"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- code bracket "</>" glyph: represents the portfolio/dev side -->
  <path d="M25 20 L14 32 L25 44" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 20 L50 32 L39 44" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small checkmark badge: represents the todo side -->
  <circle cx="47" cy="47" r="13" fill="#0b1220"/>
  <circle cx="47" cy="47" r="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  <path d="M41.5 47.2 L45.2 51 L52.5 43.5" fill="none" stroke="#2fe0c4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
